openapi: 3.0.3
info:
  title: Archmap API
  version: 0.13.0
  description: |
    Single source of truth for the Archmap HTTP API.
    `/metrics` (Prometheus) is intentionally not part of this spec.

    Every modification of the model is a change inside a changeset. Under the
    `required` review policy main is read-only and edits go through reviewed drafts;
    under `direct` an editor's save is an automatically merged changeset
    (`POST /api/v1/model/changes`, ADR-072). Callers are identified by a server-side session cookie
    obtained from `POST /api/v1/auth/login` (or a redirect provider's callback).
    Unsafe requests made with a session must send the session's CSRF token in the
    `X-CSRF-Token` header and come from the same origin.
servers:
  - url: http://localhost:8080
security:
  - sessionCookie: []
paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Liveness / readiness probe
      tags: [system]
      security: []
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me:
    get:
      operationId: getMe
      summary: The authenticated user
      tags: [auth]
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Me"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/me/password:
    put:
      operationId: changeMyPassword
      summary: Change the caller's local password (other sessions are revoked)
      tags: [auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordRequest"
      responses:
        "204":
          description: Password changed
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/providers:
    get:
      operationId: listAuthProviders
      summary: Sign-in methods available on this server (the login page renders from this)
      tags: [auth]
      security: []
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthProviderList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Sign in with a password-kind provider; sets the session cookie
      description: |
        Failed credentials always answer 401 with the same message. 403 means the
        credentials were correct but the account is disabled, has no account for
        this identity, or must use single sign-on. 429 carries Retry-After.
      tags: [auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Signed in (sets the session cookie)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/{provider}/start:
    get:
      operationId: startAuthRedirect
      summary: Start a redirect-kind login (browser navigation; redirects to the identity provider)
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - name: return_to
          in: query
          required: false
          description: Same-origin path to return to after signing in (anything else falls back to "/").
          schema: { type: string }
      responses:
        "302":
          description: Redirect to the identity provider
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/{provider}/callback:
    get:
      operationId: authCallback
      summary: Redirect-kind login callback; sets the session cookie and redirects into the app
      description: Failures redirect to `/login?error=<code>` instead of answering problem+json.
      tags: [auth]
      security: []
      parameters:
        - $ref: "#/components/parameters/Provider"
        - { name: code, in: query, required: false, schema: { type: string } }
        - { name: state, in: query, required: false, schema: { type: string } }
        - { name: error, in: query, required: false, schema: { type: string } }
        - { name: error_description, in: query, required: false, schema: { type: string } }
      responses:
        "302":
          description: Redirect into the app (or to the login page with an error code)
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/logout:
    post:
      operationId: logout
      summary: End the current session and clear the cookie
      tags: [auth]
      security: []
      responses:
        "204":
          description: Signed out (also when there was no session)
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/auth/session:
    get:
      operationId: getSession
      summary: The current session (user, CSRF token, expiry); 401 when signed out
      tags: [auth]
      responses:
        "200":
          description: Current session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: All users with their roles (maintainers only)
      tags: [users]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createUser
      summary: Create a user with a local password identity (maintainers only)
      description: Without `password` a temporary password is generated, returned once, and must be changed at first sign-in.
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: The new user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreatedUser"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/role:
    put:
      operationId: setUserRole
      summary: Change a user's role (maintainers only; the last maintainer cannot be demoted)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetRoleRequest"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/disable:
    post:
      operationId: disableUser
      summary: Disable a user and end their sessions (maintainers only; not yourself, not the last break-glass maintainer)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/enable:
    post:
      operationId: enableUser
      summary: Re-enable a disabled user (maintainers only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/password-reset:
    post:
      operationId: resetUserPassword
      summary: Set a new local password for a user and end their sessions (maintainers only)
      description: Without `password` a temporary one is generated and returned once. Either way the user must change it at next sign-in.
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "200":
          description: Password reset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetResult"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/identities:
    get:
      operationId: listUserIdentities
      summary: A user's sign-in identities (maintainers only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Identities
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IdentityList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: linkUserIdentity
      summary: Link an external identity (provider + subject) to a user (maintainers only; never automatic)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkIdentityRequest"
      responses:
        "201":
          description: The linked identity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Identity"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/users/{id}/identities/{identityId}:
    delete:
      operationId: unlinkUserIdentity
      summary: Remove a sign-in identity and the sessions created with it (maintainers only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: identityId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204":
          description: Unlinked
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/directory:
    get:
      operationId: getDirectory
      summary: Users (name, email, disabled) and groups, for picking owners (any signed-in user)
      tags: [users]
      responses:
        "200":
          description: Directory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Directory"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/groups:
    get:
      operationId: listGroups
      summary: Groups and their members (any signed-in user)
      tags: [users]
      responses:
        "200":
          description: Groups
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GroupList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createGroup
      summary: Create a group (maintainers only)
      tags: [users]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "201":
          description: The new group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/groups/{id}:
    put:
      operationId: updateGroup
      summary: Rename a group or change its description (maintainers only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupInput"
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteGroup
      summary: Delete a group (maintainers only); owners pointing at it keep their name and lint warns
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/groups/{id}/members:
    put:
      operationId: setGroupMembers
      summary: Replace a group's members (maintainers only)
      tags: [users]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GroupMembersInput"
      responses:
        "200":
          description: The updated group
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Group"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/elements:
    get:
      operationId: listElements
      summary: Elements of main
      tags: [model]
      parameters:
        - name: parent_id
          in: query
          schema: { type: string, format: uuid }
        - name: q
          in: query
          description: Case-insensitive substring match on the name
          schema: { type: string }
      responses:
        "200":
          description: Matching elements
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElementList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/elements/{id}:
    get:
      operationId: getElement
      summary: One element of main
      tags: [model]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The element
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Element"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/owners:
    get:
      operationId: listOwners
      summary: Owners and ownership assignments of main
      tags: [model]
      responses:
        "200":
          description: Owner directory of main
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDirectory"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/relations:
    get:
      operationId: listRelations
      summary: Relations of main
      tags: [model]
      parameters:
        - name: source_id
          in: query
          schema: { type: string, format: uuid }
        - name: target_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Matching relations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RelationList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/relations/{id}:
    get:
      operationId: getRelation
      summary: One relation of main
      tags: [model]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The relation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Relation"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/settings:
    get:
      operationId: getSettings
      summary: Workspace settings (review policy)
      tags: [settings]
      responses:
        "200":
          description: The settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: updateSettings
      summary: Change the workspace settings (maintainers only)
      tags: [settings]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SettingsInput"
      responses:
        "200":
          description: The updated settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Settings"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/changes:
    post:
      operationId: applyDirect
      summary: Edit main directly (review policy `direct`)
      description: |
        Records the batch as a changeset based on the current main and merges it at once
        as a new version. When the batch adds lint errors it is kept as a draft instead;
        when it touches a protected element it is submitted for review (ADR-072).
      tags: [changesets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DirectChangesRequest"
      responses:
        "201":
          description: What happened to the edit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectResult"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/model/changes/{id}/revert:
    post:
      operationId: revertDirect
      summary: Undo a direct edit (a new version that reverses it)
      description: |
        Fails with 409 when what the edit changed was changed again since, or when it was
        already undone. Only its author or a maintainer may undo it.
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "201":
          description: What happened to the undo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DirectResult"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets:
    get:
      operationId: listChangesets
      summary: List changesets
      tags: [changesets]
      parameters:
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ChangesetStatus"
        - name: author_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Changesets, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createChangeset
      summary: Open a new draft based on the current main version (editor+)
      tags: [changesets]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChangesetRequest"
      responses:
        "201":
          description: The new draft
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}:
    get:
      operationId: getChangeset
      summary: A changeset with its change log (undone changes included)
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesetDetail"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/model:
    get:
      operationId: getChangesetModel
      summary: Effective model of a draft (main + its active changes)
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The effective model
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/changes:
    post:
      operationId: addChanges
      summary: Record one batch of changes (one GUI edit) in a draft
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddChangesRequest"
      responses:
        "201":
          description: The recorded changes (cascades are expanded into explicit changes)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/changes/last:
    delete:
      operationId: undoChange
      summary: Undo the latest batch
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The changes that were undone
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/changes/redo:
    post:
      operationId: redoChange
      summary: Redo the most recently undone batch
      tags: [changesets]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The changes that were restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangeList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/diff:
    get:
      operationId: getChangesetDiff
      summary: Structured diff of a draft against the main version it is based on
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Added / removed / modified elements and relations (field level)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/lint:
    get:
      operationId: getChangesetLint
      summary: Lint report for the draft's effective model (errors block merge)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Lint findings, errors first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LintReport"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/conflicts:
    get:
      operationId: getChangesetConflicts
      summary: Conflicts that block merging into the current main (empty when none)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Remaining conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/resolve:
    post:
      operationId: resolveChangeset
      summary: Record conflict resolutions (mine / theirs); returns the remaining conflicts
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveRequest"
      responses:
        "200":
          description: Conflicts that still need a resolution
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/submit:
    post:
      operationId: submitChangeset
      summary: Submit a draft for review (author or maintainer)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The changeset, now in review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/approve:
    post:
      operationId: approveChangeset
      summary: Approve a changeset in review (maintainer; not the author unless self-merge is enabled)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The approved changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/reject:
    post:
      operationId: rejectChangeset
      summary: Reject a changeset in review (maintainer)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The rejected changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/abandon:
    post:
      operationId: abandonChangeset
      summary: Abandon a draft or a changeset in review (author or maintainer)
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: The abandoned changeset
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Changeset"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/changesets/{id}/merge:
    post:
      operationId: mergeChangeset
      summary: Merge an approved changeset into main as a new version (maintainer)
      description: |
        Fast-forwards when main has not moved since the draft's base version,
        otherwise rebases with a field-level 3-way merge. Unresolved conflicts
        answer 409 with the conflict list and change nothing. Lint errors and
        other rule violations answer a problem+json 409 / 403.
      tags: [review]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Merged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MergeResult"
        "409":
          description: Conflicts need resolution (or another problem, as problem+json)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConflictList"
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/layer-rules:
    get:
      operationId: listLayerRules
      summary: Which layers each element class may be placed on
      tags: [layers]
      responses:
        "200":
          description: The rules (classes without a rule are unrestricted)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerRules"
        default:
          $ref: "#/components/responses/Problem"
    put:
      operationId: replaceLayerRules
      summary: Replace all layer rules (maintainer). Existing elements are not changed; edits that put an element on a disallowed layer are rejected.
      tags: [layers]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayerRules"
      responses:
        "200":
          description: The stored rules (empty ones are dropped)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LayerRules"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/views:
    get:
      operationId: listViews
      summary: Saved views (perspectives over the model)
      tags: [views]
      responses:
        "200":
          description: Views, oldest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewList"
        default:
          $ref: "#/components/responses/Problem"
    post:
      operationId: createView
      summary: Create a view (editor+). Views are not part of the changeset workflow.
      tags: [views]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "201":
          description: The new view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/views/{id}:
    put:
      operationId: updateView
      summary: Replace a view's name, kind, scope and description (creator or maintainer)
      description: For custom views, `elements` replaces the member list when present and leaves it unchanged when omitted.
      tags: [views]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ViewInput"
      responses:
        "200":
          description: The updated view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/View"
        default:
          $ref: "#/components/responses/Problem"
    delete:
      operationId: deleteView
      summary: Delete a view and its saved layout (creator or maintainer)
      tags: [views]
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "204":
          description: Deleted
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/views/{id}/model:
    get:
      operationId: getViewModel
      summary: What a view shows, with its saved layout
      description: |
        Computed from main, or from a draft's effective model when `changeset_id` is given.
        `elements` holds every root of the view plus all their descendants; a root's parent is
        not included, so the client shows it at the top level.
      tags: [views]
      parameters:
        - $ref: "#/components/parameters/Id"
        - name: changeset_id
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: The view's model and layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewModel"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/views/{id}/layout:
    put:
      operationId: setViewLayout
      summary: Replace a view's saved layout (editor+). Creates no changes and no versions.
      tags: [views]
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetLayoutRequest"
      responses:
        "200":
          description: The saved layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ViewLayout"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/versions:
    get:
      operationId: listVersions
      summary: Merged model versions, newest first
      tags: [versions]
      responses:
        "200":
          description: Versions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionList"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/versions/{from}/diff/{to}:
    get:
      operationId: getVersionDiff
      summary: What changed between two merged versions (`from` is the base, `to` the newer or older one to compare with)
      tags: [versions]
      parameters:
        - name: from
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
        - name: to
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: Structured diff (base_version = from, main_version = to, stale = false)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Diff"
        default:
          $ref: "#/components/responses/Problem"

  /api/v1/versions/{n}/model:
    get:
      operationId: getVersionModel
      summary: Main as of a merged version (read-only)
      tags: [versions]
      parameters:
        - name: n
          in: path
          required: true
          schema: { type: integer, minimum: 1 }
      responses:
        "200":
          description: The model at that version
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Model"
        default:
          $ref: "#/components/responses/Problem"

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-archmap_session
      description: |
        Opaque server-side session token (`archmap_session` when the server runs with
        COOKIE_SECURE=false in development). Unsafe methods also need `X-CSRF-Token`.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Provider:
      name: provider
      in: path
      required: true
      schema: { type: string }

  schemas:
    Health:
      type: object
      required: [status, version]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string

    Problem:
      description: RFC 9457 problem details
      type: object
      required: [title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string

    Role:
      type: string
      enum: [viewer, editor, maintainer]

    Me:
      type: object
      required: [id, email, name, role, provider, password_must_change]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Contact email; empty when unknown }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        provider: { type: string, description: The provider this session signed in with }
        password_must_change:
          type: boolean
          description: The local password was set by a maintainer and must be changed now.

    Session:
      type: object
      required: [me, csrf_token, expires_at]
      properties:
        me:
          $ref: "#/components/schemas/Me"
        csrf_token: { type: string, description: Send as X-CSRF-Token on unsafe requests }
        expires_at: { type: string, format: date-time, description: Absolute expiry (idle expiry may come sooner) }

    AuthProviderKind:
      type: string
      enum: [password, redirect]

    AuthProvider:
      type: object
      required: [id, name, kind, restricted, username_only]
      properties:
        id: { type: string }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/AuthProviderKind"
        restricted:
          type: boolean
          description: Only maintainers may use it (local password once SSO is the default).
        username_only:
          type: boolean
          description: Password-kind provider that takes no password (development sign-in).

    AuthProviderList:
      type: object
      required: [providers]
      properties:
        providers:
          type: array
          items:
            $ref: "#/components/schemas/AuthProvider"

    LoginRequest:
      type: object
      required: [provider, username]
      properties:
        provider: { type: string }
        username: { type: string, minLength: 1, maxLength: 320 }
        password: { type: string, maxLength: 256 }

    ChangePasswordRequest:
      type: object
      required: [current_password, new_password]
      properties:
        current_password: { type: string, maxLength: 256 }
        new_password: { type: string, maxLength: 256 }

    User:
      type: object
      required: [id, email, name, role, created_at, disabled, identity_count]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, description: Contact email; empty when unknown }
        name: { type: string }
        role:
          $ref: "#/components/schemas/Role"
        created_at: { type: string, format: date-time }
        disabled: { type: boolean }
        last_login_at: { type: string, format: date-time, nullable: true }
        identity_count: { type: integer }

    CreateUserRequest:
      type: object
      required: [name, email, role]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        email: { type: string, minLength: 3, maxLength: 320, description: Also the local sign-in name }
        role:
          $ref: "#/components/schemas/Role"
        password: { type: string, maxLength: 256 }

    CreatedUser:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
        temporary_password: { type: string, description: Present only when the server generated the password }

    PasswordResetRequest:
      type: object
      properties:
        password: { type: string, maxLength: 256 }

    PasswordResetResult:
      type: object
      properties:
        temporary_password: { type: string, description: Present only when the server generated the password }

    Identity:
      type: object
      required: [id, provider, issuer, subject, email, created_at]
      properties:
        id: { type: string, format: uuid }
        provider: { type: string }
        issuer: { type: string }
        subject: { type: string }
        email: { type: string, description: As reported at the last sign-in; informational only }
        created_at: { type: string, format: date-time }
        last_login_at: { type: string, format: date-time, nullable: true }

    IdentityList:
      type: object
      required: [identities]
      properties:
        identities:
          type: array
          items:
            $ref: "#/components/schemas/Identity"

    LinkIdentityRequest:
      type: object
      required: [provider, subject]
      properties:
        provider: { type: string, description: A configured external provider id }
        subject: { type: string, minLength: 1, maxLength: 255 }

    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/User"

    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          $ref: "#/components/schemas/Role"

    ElementKind:
      type: string
      description: |
        `database` was retired in M10 (ADR-062): it is still accepted in change patches and
        normalized to a `container` of type `database`, but never returned.
      enum: [person, system, container, component, node]

    ElementType:
      type: string
      description: Refines the kind; datastore types are drawn as cylinders. Empty = none.
      enum: ["", database-server, database, schema, cache, queue, proxy]

    Environment:
      type: string
      description: Empty = inherited from the ancestors (see effective.environment).
      enum: ["", prod, staging, dev]

    Lifecycle:
      type: string
      enum: [active, deprecated, planned]

    Criticality:
      type: string
      enum: ["", low, medium, high, critical]

    OwnerKind:
      type: string
      description: team / person are named owners without an account; user / group point at a login user or a group (principal_id).
      enum: [team, person, user, group]

    OwnerRole:
      type: string
      enum: [owner, maintainer, oncall, escalation]

    Owner:
      type: object
      description: A team or person accountable for elements. Model data (changes go through drafts); not a login user.
      required: [id, kind, name, contact, oncall_url, version]
      properties:
        id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/OwnerKind"
        name: { type: string, maxLength: 120 }
        contact: { type: string, maxLength: 200, description: "Email, chat channel or similar" }
        oncall_url: { type: string, description: "http(s) URL or empty" }
        principal_id:
          type: string
          format: uuid
          nullable: true
          description: |
            The user or group of a user / group owner (null for named owners). Its id is derived
            from principal_id, so send no target_id when adding one; the live name comes from /directory.
        version: { type: integer }

    Ownership:
      type: object
      description: |
        Assigns an owner to an element in one role; at most one per (element, role). The id is
        derived from element_id and role (send no target_id when adding); updates may only change owner_id.
      required: [id, element_id, owner_id, role, version]
      properties:
        id: { type: string, format: uuid }
        element_id: { type: string, format: uuid }
        owner_id: { type: string, format: uuid }
        role:
          $ref: "#/components/schemas/OwnerRole"
        version: { type: integer }

    EffectiveOwner:
      type: object
      required: [role, owner_id, source_element_id]
      properties:
        role:
          $ref: "#/components/schemas/OwnerRole"
        owner_id: { type: string, format: uuid }
        source_element_id:
          type: string
          format: uuid
          description: The element the assignment comes from (the element itself, or an ancestor when inherited).

    ElementEffective:
      type: object
      description: Values inherited from the ancestors, computed by the server (read-only).
      required: [environment, environment_source_id, owners, deployed_via_id]
      properties:
        environment:
          $ref: "#/components/schemas/Environment"
        environment_source_id: { type: string, format: uuid, nullable: true }
        owners:
          type: array
          items:
            $ref: "#/components/schemas/EffectiveOwner"
        deployed_via_id:
          type: string
          format: uuid
          nullable: true
          description: The element (itself or an ancestor) that has a deployed_on relation; null when none.

    DirectoryUser:
      type: object
      required: [id, name, email, disabled]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        email: { type: string }
        disabled: { type: boolean }

    Group:
      type: object
      required: [id, name, description, members, created_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        members:
          type: array
          items: { type: string, format: uuid }
          description: User ids
        created_at: { type: string, format: date-time }

    GroupList:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    GroupInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        description: { type: string, maxLength: 500 }

    GroupMembersInput:
      type: object
      required: [user_ids]
      properties:
        user_ids:
          type: array
          items: { type: string, format: uuid }

    Directory:
      type: object
      description: Users and groups that can be picked as owners (no roles).
      required: [users, groups]
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/DirectoryUser"
        groups:
          type: array
          items:
            $ref: "#/components/schemas/Group"

    OwnerDirectory:
      type: object
      required: [owners, ownerships]
      properties:
        owners:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        ownerships:
          type: array
          items:
            $ref: "#/components/schemas/Ownership"

    RelationKind:
      type: string
      enum: [uses, deployed_on]

    Element:
      type: object
      required: [id, parent_id, kind, name, description, technology, tags, protected, layer, projects, replicas, properties, type, environment, lifecycle, criticality, runbook_url, docs_url, last_reviewed_at, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        parent_id: { type: string, format: uuid, nullable: true }
        kind:
          $ref: "#/components/schemas/ElementKind"
        name: { type: string }
        description: { type: string }
        technology: { type: string }
        tags:
          type: array
          items: { type: string }
        protected: { type: boolean }
        layer:
          type: string
          maxLength: 60
          description: Layer in layers views, e.g. Services or Physical. Empty = unassigned.
        projects:
          type: array
          maxItems: 20
          items: { type: string, maxLength: 60 }
          description: Projects the element belongs to (may be several). Views can highlight the elements of a project.
        replicas:
          type: integer
          minimum: 1
          maximum: 100
          description: How many instances the element stands for (1 = a single one).
        properties:
          type: object
          maxProperties: 20
          additionalProperties: { type: string, maxLength: 200 }
          description: Free-form facts such as ip, port or namespace (key to value).
        type:
          $ref: "#/components/schemas/ElementType"
        environment:
          $ref: "#/components/schemas/Environment"
        lifecycle:
          $ref: "#/components/schemas/Lifecycle"
        criticality:
          $ref: "#/components/schemas/Criticality"
        runbook_url: { type: string, description: "http(s) URL or empty" }
        docs_url: { type: string, description: "http(s) URL or empty" }
        last_reviewed_at: { type: string, format: date, nullable: true }
        effective:
          $ref: "#/components/schemas/ElementEffective"
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    Relation:
      type: object
      required: [id, source_id, target_id, kind, description, technology, version, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        source_id: { type: string, format: uuid }
        target_id: { type: string, format: uuid }
        kind:
          $ref: "#/components/schemas/RelationKind"
        description: { type: string }
        technology: { type: string }
        version: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ElementList:
      type: object
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Element"

    RelationList:
      type: object
      required: [relations]
      properties:
        relations:
          type: array
          items:
            $ref: "#/components/schemas/Relation"

    Model:
      type: object
      required: [elements, relations, owners, ownerships]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Element"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/Relation"
        owners:
          type: array
          items:
            $ref: "#/components/schemas/Owner"
        ownerships:
          type: array
          items:
            $ref: "#/components/schemas/Ownership"

    ChangesetStatus:
      type: string
      enum: [draft, in_review, merged, rejected, abandoned]

    Changeset:
      type: object
      required: [id, title, description, author_id, base_version, status, created_at, merged_at, kind, reverts]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        description: { type: string }
        author_id: { type: string, format: uuid }
        base_version: { type: integer }
        status:
          $ref: "#/components/schemas/ChangesetStatus"
        created_at: { type: string, format: date-time }
        merged_at: { type: string, format: date-time, nullable: true }
        approved_by: { type: string, format: uuid, nullable: true }
        approved_at: { type: string, format: date-time, nullable: true }
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        reverts:
          type: string
          format: uuid
          nullable: true
          description: The direct edit this changeset undoes

    ChangesetKind:
      type: string
      enum: [draft, direct]
      description: "`direct`: an automatically merged edit of main (not listed with the drafts)"

    ReviewPolicy:
      type: string
      enum: [required, direct]

    Settings:
      type: object
      required: [review_policy, updated_by, updated_at]
      properties:
        review_policy:
          $ref: "#/components/schemas/ReviewPolicy"
        updated_by: { type: string, format: uuid, nullable: true }
        updated_at: { type: string, format: date-time }

    SettingsInput:
      type: object
      required: [review_policy]
      properties:
        review_policy:
          $ref: "#/components/schemas/ReviewPolicy"

    DirectChangesRequest:
      type: object
      required: [changes]
      properties:
        summary:
          type: string
          maxLength: 200
          description: Version summary (defaults to "Direct edit")
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ChangeInput"

    DirectOutcome:
      type: string
      enum: [merged, draft, in_review]

    DirectResult:
      type: object
      required: [outcome, changeset, version, reason]
      properties:
        outcome:
          $ref: "#/components/schemas/DirectOutcome"
        changeset:
          $ref: "#/components/schemas/Changeset"
        version:
          type: integer
          description: The new main version (0 unless merged)
        reason:
          type: string
          description: Why the edit was not merged directly (empty when merged)

    ChangesetList:
      type: object
      required: [changesets]
      properties:
        changesets:
          type: array
          items:
            $ref: "#/components/schemas/Changeset"

    CreateChangesetRequest:
      type: object
      required: [title]
      properties:
        title: { type: string, minLength: 1 }
        description: { type: string }

    ChangeOp:
      type: string
      enum: [add, update, delete]

    ChangeTarget:
      type: string
      enum: [element, relation, owner, ownership]

    Change:
      type: object
      required: [id, changeset_id, seq, batch_id, op, target_type, target_id, patch, before, undone_at, created_at]
      properties:
        id: { type: string, format: uuid }
        changeset_id: { type: string, format: uuid }
        seq: { type: integer }
        batch_id: { type: string, format: uuid }
        op:
          $ref: "#/components/schemas/ChangeOp"
        target_type:
          $ref: "#/components/schemas/ChangeTarget"
        target_id: { type: string, format: uuid }
        patch:
          type: object
          additionalProperties: true
        before:
          type: object
          nullable: true
          additionalProperties: true
        undone_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }

    ChangeList:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    ChangesetDetail:
      type: object
      required: [changeset, changes]
      properties:
        changeset:
          $ref: "#/components/schemas/Changeset"
        changes:
          type: array
          items:
            $ref: "#/components/schemas/Change"

    ChangeInput:
      type: object
      required: [op, target_type]
      properties:
        op:
          $ref: "#/components/schemas/ChangeOp"
        target_type:
          $ref: "#/components/schemas/ChangeTarget"
        target_id:
          type: string
          format: uuid
          description: Required for update / delete. For add it is optional (server generates one); supply it to reference the new entity later in the same batch.
        patch:
          type: object
          additionalProperties: true
          description: |
            add: the entity fields:
              element - kind, name, parent_id, description, technology, tags, protected, layer, projects,
                replicas, properties, type, environment, lifecycle, criticality, runbook_url, docs_url, last_reviewed_at;
              relation - source_id, target_id, kind, description, technology;
              owner - kind, name, contact, oncall_url;
              ownership - element_id, owner_id, role (the id is derived from element_id and role).
            update: only the fields to change (null clears parent_id / last_reviewed_at; an ownership update may only set owner_id).
            delete: omitted.
        cascade:
          type: boolean
          description: |
            Element: delete it together with all its descendants (relations and ownerships always go with it).
            Owner: delete it together with its ownership assignments.

    AddChangesRequest:
      type: object
      required: [changes]
      properties:
        changes:
          type: array
          minItems: 1
          maxItems: 500
          items:
            $ref: "#/components/schemas/ChangeInput"

    FieldChange:
      type: object
      required: [field, before, after]
      properties:
        field: { type: string }
        before: {}
        after: {}

    ElementModification:
      type: object
      required: [before, after, fields]
      properties:
        before:
          $ref: "#/components/schemas/Element"
        after:
          $ref: "#/components/schemas/Element"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"

    RelationModification:
      type: object
      required: [before, after, fields]
      properties:
        before:
          $ref: "#/components/schemas/Relation"
        after:
          $ref: "#/components/schemas/Relation"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"

    OwnerModification:
      type: object
      required: [before, after, fields]
      properties:
        before:
          $ref: "#/components/schemas/Owner"
        after:
          $ref: "#/components/schemas/Owner"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"

    OwnershipModification:
      type: object
      required: [before, after, fields]
      properties:
        before:
          $ref: "#/components/schemas/Ownership"
        after:
          $ref: "#/components/schemas/Ownership"
        fields:
          type: array
          items:
            $ref: "#/components/schemas/FieldChange"

    Diff:
      type: object
      required: [base_version, main_version, stale, elements, relations, owners, ownerships]
      properties:
        base_version: { type: integer }
        main_version: { type: integer }
        stale:
          type: boolean
          description: Main has moved since the draft's base version (merging rebases)
        elements:
          type: object
          required: [added, removed, modified]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/Element"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/Element"
            modified:
              type: array
              items:
                $ref: "#/components/schemas/ElementModification"
        relations:
          type: object
          required: [added, removed, modified]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/Relation"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/Relation"
            modified:
              type: array
              items:
                $ref: "#/components/schemas/RelationModification"
        owners:
          type: object
          required: [added, removed, modified]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/Owner"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/Owner"
            modified:
              type: array
              items:
                $ref: "#/components/schemas/OwnerModification"
        ownerships:
          type: object
          required: [added, removed, modified]
          properties:
            added:
              type: array
              items:
                $ref: "#/components/schemas/Ownership"
            removed:
              type: array
              items:
                $ref: "#/components/schemas/Ownership"
            modified:
              type: array
              items:
                $ref: "#/components/schemas/OwnershipModification"

    LintSeverity:
      type: string
      enum: [error, warning]

    LintFinding:
      type: object
      required: [rule, severity, message, target_type, target_id]
      properties:
        rule: { type: string }
        severity:
          $ref: "#/components/schemas/LintSeverity"
        message: { type: string }
        target_type:
          $ref: "#/components/schemas/ChangeTarget"
        target_id: { type: string, format: uuid }

    LintReport:
      type: object
      required: [errors, warnings, findings]
      properties:
        errors: { type: integer }
        warnings: { type: integer }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/LintFinding"

    ConflictKind:
      type: string
      enum: [field, delete_vs_update, dangling_reference]

    Conflict:
      type: object
      required: [kind, target_type, target_id, field, label, message, base, mine, theirs]
      properties:
        kind:
          $ref: "#/components/schemas/ConflictKind"
        target_type:
          $ref: "#/components/schemas/ChangeTarget"
        target_id: { type: string, format: uuid }
        field:
          type: string
          description: Field name, or "*" when the conflict concerns the whole target
        label: { type: string }
        message: { type: string }
        base:
          description: Field value (or entity fields / null for whole-target conflicts) at the draft's base version
        mine:
          description: The draft's value
        theirs:
          description: Main's current value

    ConflictList:
      type: object
      required: [conflicts]
      properties:
        conflicts:
          type: array
          items:
            $ref: "#/components/schemas/Conflict"

    ResolutionChoice:
      type: string
      enum: [mine, theirs]

    Resolution:
      type: object
      required: [target_type, target_id, field, choice]
      properties:
        target_type:
          $ref: "#/components/schemas/ChangeTarget"
        target_id: { type: string, format: uuid }
        field: { type: string, minLength: 1 }
        choice:
          $ref: "#/components/schemas/ResolutionChoice"

    ResolveRequest:
      type: object
      required: [resolutions]
      properties:
        resolutions:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/Resolution"

    MergeResult:
      type: object
      required: [version, changeset]
      properties:
        version: { type: integer }
        changeset:
          $ref: "#/components/schemas/Changeset"

    Version:
      type: object
      required: [number, changeset_id, merged_by, merged_at, summary, kind, reverts]
      properties:
        number: { type: integer }
        changeset_id: { type: string, format: uuid }
        merged_by: { type: string, format: uuid }
        merged_at: { type: string, format: date-time }
        summary: { type: string }
        kind:
          $ref: "#/components/schemas/ChangesetKind"
        reverts:
          type: string
          format: uuid
          nullable: true
          description: The direct edit this version undoes

    VersionList:
      type: object
      required: [versions]
      properties:
        versions:
          type: array
          items:
            $ref: "#/components/schemas/Version"

    ViewKind:
      type: string
      enum: [landscape, context, container, component, deployment, custom, layers, unowned]

    View:
      type: object
      required: [id, name, kind, scope_element_id, description, layers, created_by, created_at, updated_at]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        kind:
          $ref: "#/components/schemas/ViewKind"
        scope_element_id: { type: string, format: uuid, nullable: true }
        description: { type: string }
        layers:
          type: array
          description: Ordered layer names of a layers view, top to bottom (empty for other kinds).
          items: { type: string }
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ViewList:
      type: object
      required: [views]
      properties:
        views:
          type: array
          items:
            $ref: "#/components/schemas/View"

    LayerRule:
      type: object
      required: [element_class, layers]
      properties:
        element_class:
          type: string
          description: "An element kind: person, system, container, component, node or database."
        layers:
          type: array
          maxItems: 12
          description: Layers (names, matched ignoring case) the class may be placed on. Elements without a layer are always allowed.
          items: { type: string, minLength: 1, maxLength: 60 }

    LayerRules:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/LayerRule"

    ViewInput:
      type: object
      required: [name, kind]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        kind:
          $ref: "#/components/schemas/ViewKind"
        scope_element_id:
          type: string
          format: uuid
          nullable: true
          description: Required for context / container / component, optional for deployment, not allowed otherwise.
        description: { type: string }
        layers:
          type: array
          maxItems: 12
          description: Layer names of a layers view, top to bottom (required for layers views, not allowed otherwise).
          items: { type: string, minLength: 1, maxLength: 60 }
        elements:
          type: array
          description: Members of a custom view.
          items: { type: string, format: uuid }

    ViewElement:
      type: object
      required: [element_id, collapsed]
      properties:
        element_id: { type: string, format: uuid }
        x: { type: number, format: double, nullable: true }
        y: { type: number, format: double, nullable: true }
        w: { type: number, format: double, nullable: true }
        h: { type: number, format: double, nullable: true }
        collapsed: { type: boolean }
        included:
          type: boolean
          description: Custom-view membership (response only; ignored when saving a layout).

    ViewLayout:
      type: object
      required: [elements]
      properties:
        elements:
          type: array
          items:
            $ref: "#/components/schemas/ViewElement"

    SetLayoutRequest:
      type: object
      required: [elements]
      properties:
        elements:
          type: array
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ViewElement"

    ViewModel:
      type: object
      required: [view, elements, relations, roots, expanded, layout, scope_missing]
      properties:
        view:
          $ref: "#/components/schemas/View"
        elements:
          type: array
          items:
            $ref: "#/components/schemas/Element"
        relations:
          type: array
          items:
            $ref: "#/components/schemas/Relation"
        roots:
          type: array
          items: { type: string, format: uuid }
        expanded:
          type: array
          description: Elements that start expanded when the view has no saved layout for them.
          items: { type: string, format: uuid }
        layout:
          type: array
          items:
            $ref: "#/components/schemas/ViewElement"
        scope_missing:
          type: boolean
          description: The view's scope element does not exist in the model being shown.

  responses:
    Problem:
      description: Error
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
